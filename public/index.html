<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0f" />
<!-- 回答内の出典リンクやCDNへのリクエストにこのサーバーのURLを漏らさない (プライベート運用の保護) -->
<meta name="referrer" content="no-referrer" />
<title>OpenGeekLLMChat</title>
<link rel="icon" type="image/jpeg" href="/aiicon.jpg" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<!-- PDF.js v3 (PDFテキスト抽出用、約1MB、初回PDF読込時のみダウンロードされる)
     注意: cdnjs では v4系 は配信されていないため v3.11.174 (UMD形式、pdfjsLib グローバル提供) を使う -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- エージェントハーネスのブラウザ側ゲート (権限モード/宣言フック/リマインダー)。
     読み込み失敗時も index.jsx 側の window.HarnessClient ガードで従来どおり動く -->
<script src="/js/harness_client.js"></script>
<script type="text/babel" src="/js/index.jsx"></script>
</body>
</html>
